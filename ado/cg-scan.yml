# Prototype for ADO Feature 84645, phase 0c: the CG scan template a service repository's thin
# .github/ado/cg-scan.yml extends. Lives only on branch proto/cg-scan; consumed by tag.

parameters:
  - name: templateVersion
    type: string
    default: cgproto-template-7
  - name: scanType
    type: string
    default: LogOnly
    values: [LogOnly, Register]
  - name: mavenProfiles
    type: string
    default: core,azure
  - name: shippedModules
    type: string
    default: ''
  - name: upstreamUrl
    type: string
    default: ''
  - name: upstreamBaseline
    type: string
    default: ''
  - name: images
    type: string
    default: ''
  # Phase 0d: when set, branch runs refresh NOTICE from CG and open or update a PR into this base branch.
  - name: noticePrBase
    type: string
    default: ''
  - name: noticePrBranch
    type: string
    default: proto/notice-refresh

jobs:
  - job: cg_scan
    displayName: CG scan (prototype)
    pool:
      vmImage: ubuntu-latest
    variables:
      # Test: does this suppress the policy-injected Component Detection?
      skipComponentGovernanceDetection: true
      SETTINGS_FILE: $(Build.SourcesDirectory)/.mvn/community-maven.settings.xml
      OUT: $(Build.ArtifactStagingDirectory)/cg-scan
    steps:
      - checkout: self
        # The NOTICE PR step pushes with the Azure Pipelines App token from the service connection.
        persistCredentials: ${{ ne(parameters.noticePrBase, '') }}
        fetchDepth: 0

      - bash: |
          set -euo pipefail
          echo "template:      osdu-spi ado/cg-scan.yml ${{ parameters.templateVersion }}"
          echo "scan type:     ${{ parameters.scanType }}"
          echo "source:        $(Build.SourceBranch) $(Build.SourceVersion) ($(Build.Reason))"
          mkdir -p "$OUT"
          java -version 2>&1 | head -1
          mvn -v | head -1
          mv=$(mvn -v | head -1 | sed -E 's/.*Maven ([0-9]+)\.([0-9]+).*/\1 \2/')
          set -- $mv
          if [ "$1" -lt 3 ] || { [ "$1" -eq 3 ] && [ "$2" -lt 9 ]; }; then echo "##[error]Maven >= 3.9 required for MAVEN_ARGS"; exit 1; fi
        displayName: Tooling

      - bash: |
          set -euo pipefail
          mvn -B -ntp -q --settings="$SETTINGS_FILE" -P '${{ parameters.mavenProfiles }}' \
            -pl '${{ parameters.shippedModules }}' -am install -DskipTests
          mvn -B -ntp -q --settings="$SETTINGS_FILE" -P '${{ parameters.mavenProfiles }}' \
            -pl '${{ parameters.shippedModules }}' dependency:list -DincludeScope=runtime \
            -DoutputFile="$OUT/dependency-list.txt" -DexcludeTransitive=false
          grep -E '^\s+[^ ]+:[^ ]+:[^ ]+:[^ ]+' "$OUT/dependency-list.txt" \
            | sed -E 's/^\s+//; s/ .*//' | awk -F: '{print $1":"$2":"$(NF-1)}' | sort -u > "$OUT/inventory.txt"
          echo "runtime inventory of ${{ parameters.shippedModules }}: $(wc -l < "$OUT/inventory.txt") components"
        displayName: Build shipped modules and runtime inventory

      - bash: |
          set -euo pipefail
          is_generated() { case "$(git log -1 --format=%s "$1")" in "chore: generate filtered upstream tree"|"chore: mirror upstream tree") return 0;; esac; return 1; }
          filt=(--grep='^Upstream-Sha: [0-9a-f]\{40\}$' --grep='^Filter-Rev: ' --all-match)
          cands=(); while read -r c; do is_generated "$c" && cands+=("$c"); done < <(git rev-list --topo-order "${filt[@]}" HEAD)
          if [ "${#cands[@]}" -eq 0 ]; then
            echo "##[warning]No generated upstream commit is reachable from HEAD; using the contract baseline."
            up='${{ parameters.upstreamBaseline }}'; src=contract-baseline
            [ -n "$up" ] || { echo "##[error]No upstream provenance and no baseline"; exit 1; }
          else
            chosen=${cands[0]}
            others=0; while read -r c; do is_generated "$c" && others=$((others+1)); done < <(git rev-list "${filt[@]}" HEAD "^$chosen")
            [ "$others" -eq 0 ] || { echo "##[error]Ambiguous upstream provenance"; exit 1; }
            up=$(git log -1 --format='%(trailers:key=Upstream-Sha,valueonly,separator=)' "$chosen" | tr -d '[:space:]')
            [ "$up" = "$(git rev-parse "$chosen^2")" ] || { echo "##[error]Upstream-Sha is not the second parent"; exit 1; }
            src="generated commit $chosen"
          fi
          echo "upstream: ${{ parameters.upstreamUrl }} @ $up ($src)"
          seeds=$(git log HEAD --grep='^Seeded-From: ' --format='%(trailers:key=Seeded-From,valueonly)' | grep . || true)
          echo "seeds: ${seeds:-none}"
          UP_URL='${{ parameters.upstreamUrl }}' UP_SHA="$up" SEEDS="$seeds" python3 - <<'PY'
          import json, os
          url = os.environ["UP_URL"]
          shas = [os.environ["UP_SHA"]] + [l.split()[1] for l in os.environ["SEEDS"].splitlines() if l.strip()]
          regs, seen = [], set()
          for sha in shas:
              if sha in seen:
                  continue
              seen.add(sha)
              regs.append({"component": {"type": "git", "git": {"repositoryUrl": url, "commitHash": sha}}})
          doc = {"$schema": "https://json.schemastore.org/component-detection-manifest.json", "version": 1, "registrations": regs}
          for p in ("cgmanifest.json", os.path.join(os.environ["OUT"], "cgmanifest.json")):
              with open(p, "w") as f:
                  json.dump(doc, f, indent=2)
          print(json.dumps(doc, indent=2))
          PY
        displayName: Resolve upstream provenance and write cgmanifest.json

      - bash: |
          set -euo pipefail
          IFS=',' read -ra imgs <<< '${{ parameters.images }}'
          for i in "${imgs[@]}"; do [ -n "$i" ] && docker pull -q "$i"; done
          docker images --digests --format '{{.Repository}}@{{.Digest}} {{.Size}}' | grep -F ghcr.io || true
        displayName: Pull published images
        condition: ne('${{ parameters.images }}', '')

      - task: ComponentGovernanceComponentDetection@0
        displayName: Component Detection (explicit, ${{ parameters.scanType }})
        inputs:
          scanType: ${{ parameters.scanType }}
          verbosity: Verbose
          sourceScanPath: $(Build.SourcesDirectory)
          dockerImagesToScan: ${{ parameters.images }}
          alertWarningLevel: High
        env:
          MAVEN_ARGS: --settings=$(SETTINGS_FILE) -P ${{ parameters.mavenProfiles }} -pl ${{ parameters.shippedModules }} -am

      - bash: |
          set -euo pipefail
          cp "$BUILD_ARTIFACTSTAGINGDIRECTORY"/GovCompDisc_Manifest_*.json "$OUT"/ 2>/dev/null || true
          python3 - <<'PY'
          import glob, json, os
          out = os.environ["OUT"]
          files = sorted(glob.glob(os.path.join(out, "GovCompDisc_Manifest_*.json")))
          print("CD manifests:", files)
          def entries(doc):
              if isinstance(doc, list):
                  return doc
              for key in ("componentsFound", "ComponentsFound", "components", "Components"):
                  if isinstance(doc, dict) and key in doc:
                      return doc[key]
              return []
          def g(d, *keys):
              for k in keys:
                  if isinstance(d, dict) and k in d:
                      return d[k]
              return None
          comps = []
          for f in files:
              doc = json.load(open(f))
              e = entries(doc)
              if e:
                  print("sample entry keys:", list(e[0].keys()) if isinstance(e[0], dict) else type(e[0]))
                  print("sample entry:", json.dumps(e[0])[:600])
              comps += e
          by_type, maven, gits = {}, set(), set()
          for c in comps:
              comp = g(c, "component", "Component") or c
              t = str(g(comp, "type", "Type") or "?")
              by_type[t] = by_type.get(t, 0) + 1
              inner = g(comp, "maven", "Maven") or comp
              if t.lower() == "maven":
                  maven.add(f'{g(inner, "groupId", "GroupId")}:{g(inner, "artifactId", "ArtifactId")}:{g(inner, "version", "Version")}')
              if t.lower() == "git":
                  gi = g(comp, "git", "Git") or comp
                  gits.add(f'{g(gi, "repositoryUrl", "RepositoryUrl")}@{g(gi, "commitHash", "CommitHash")}')
          inv = {l.strip() for l in open(os.path.join(out, "inventory.txt")) if l.strip()}
          missing = sorted(inv - maven)
          print("components by type:", by_type)
          print("git components:", sorted(gits))
          print(f"runtime inventory {len(inv)}, detected maven {len(maven)}, inventory not detected {len(missing)}")
          for m in missing[:40]:
              print("  MISSING", m)
          jts = sorted(m for m in maven if ":jts" in m)
          print("jts:", jts)
          json.dump({"byType": by_type, "git": sorted(gits), "inventory": len(inv), "maven": len(maven), "missing": missing, "jts": jts},
                    open(os.path.join(out, "verify.json"), "w"), indent=2)
          PY
        displayName: Verify detection against runtime inventory
        condition: succeededOrFailed()

      - ${{ if ne(parameters.noticePrBase, '') }}:
        - bash: |
            set -euo pipefail
            python3 - <<'PY'
            import base64, json, os, subprocess, time, urllib.error, urllib.request
            env = os.environ

            def call(url, method="GET", body=None, basic=None, bearer=None):
                data = json.dumps(body).encode() if body is not None else None
                req = urllib.request.Request(url, method=method, data=data)
                req.add_header("Accept", "application/json")
                if basic:
                    req.add_header("Authorization", "Basic " + base64.b64encode((":" + basic).encode()).decode())
                if bearer:
                    req.add_header("Authorization", "Bearer " + bearer)
                    req.add_header("X-GitHub-Api-Version", "2022-11-28")
                if data:
                    req.add_header("Content-Type", "application/json")
                try:
                    with urllib.request.urlopen(req, timeout=300) as r:
                        raw = r.read()
                        return json.loads(raw) if raw else None
                except urllib.error.HTTPError as e:
                    raise SystemExit(f"##[error]{method} {url.split('?')[0]} -> HTTP {e.code}: {e.read()[:500]!r}")

            def git(*args):
                return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout.strip()

            ado = env["SYSTEM_ACCESSTOKEN"]
            proj, repo = env["SYSTEM_TEAMPROJECTID"], env["BUILD_REPOSITORY_NAME"]
            branch = env["BUILD_SOURCEBRANCH"].removeprefix("refs/heads/")
            gov = call(f'{env["SYSTEM_COLLECTIONURI"]}_apis/resourceareas/7136235f-d277-4c27-9194-e3ada05fea2c?api-version=7.1-preview.1',
                       basic=ado)["locationUrl"]
            api = f"{gov}{proj}/_apis/componentgovernance/governedrepositories"

            repos = call(f"{api}?api-version=5.0-preview.1", basic=ado)["value"]
            gr = [r for r in repos if (r.get("name") or "").lower() == repo.lower()]
            if len(gr) != 1:
                raise SystemExit(f"##[error]expected one governed repository named {repo}, found {len(gr)}")
            gid = gr[0]["id"]

            phase = env.get("SYSTEM_PHASEID", "")
            print("phase variables:", {k: v for k, v in env.items() if "PHASE" in k})
            prefix = f'vsts://{env["SYSTEM_COLLECTIONID"]}/{proj}/{env["SYSTEM_DEFINITIONID"]}/'.lower()
            want_source = f"github://{repo}/{branch}".lower()
            types = call(f"{api}/{gid}/snapshottypes?api-version=5.0-preview.1", basic=ado)["value"]
            same = [t for t in types if t["buildType"].lower().startswith(prefix) and t["sourceType"].lower() == want_source]
            match = [t for t in same if t["buildType"].lower() == prefix + phase.lower()] if phase else same
            if len(match) != 1:
                for t in types:
                    print("candidate", t["typeId"], t["buildType"], t["sourceType"])
                raise SystemExit(f"##[error]no unique snapshot type for {prefix}{phase} {want_source}")
            type_id = match[0]["typeId"]
            print(f"governed repository {gid}, snapshot type {type_id}")

            for attempt in range(1, 4):
                try:
                    res = call(f"{api}/{gid}/Notice?snapshotTypeId={type_id}&format=text", basic=ado)
                    break
                except SystemExit as e:
                    if attempt == 3:
                        raise
                    print(f"Notice attempt {attempt} failed ({e}); retrying in 30 s")
                    time.sleep(30)
            content = res["content"]
            out = env["OUT"]
            open(os.path.join(out, "NOTICE.cg"), "w").write(content)
            json.dump(res.get("excludedComponents"), open(os.path.join(out, "notice-excluded.json"), "w"), indent=2)
            entries = content.count("\n---------------------------------------------------------\n")
            print(f"CG NOTICE: {len(content)} chars, about {entries} entries")

            current = open("NOTICE").read() if os.path.exists("NOTICE") else None
            if current == content:
                print("NOTICE unchanged; no PR.")
                raise SystemExit(0)

            # The checkout persisted the service connection's GitHub App token as an extraheader.
            hdr = [l for l in git("config", "--get-regexp", r"^http\..*\.extraheader$").splitlines() if "AUTHORIZATION" in l.upper()]
            if not hdr:
                raise SystemExit("##[error]no persisted GitHub credential in git config")
            cred = base64.b64decode(hdr[0].split()[-1]).decode()
            gh = cred.split(":", 1)[1]
            print(f"##vso[task.setsecret]{gh}")
            print(f"persisted credential user: {cred.split(':', 1)[0]}")

            head, base = env["NOTICE_PR_BRANCH"], env["NOTICE_PR_BASE"]
            open("NOTICE", "w").write(content)
            git("config", "user.name", "osdu-spi CG pipeline (prototype)")
            git("config", "user.email", "osdu-spi-cg-prototype@users.noreply.github.com")
            git("checkout", "-B", head)
            git("add", "NOTICE")
            run_url = f'{env["SYSTEM_COLLECTIONURI"]}{env["SYSTEM_TEAMPROJECT"]}/_build/results?buildId={env["BUILD_BUILDID"]}'
            git("commit", "-m", "chore(notice): refresh NOTICE from Component Governance",
                "-m", f"Generated from CG snapshot type {type_id} by {run_url}")
            git("push", "--force", "origin", f"HEAD:refs/heads/{head}")
            print(f"pushed {head} {git('rev-parse', 'HEAD')}")

            owner = repo.split("/")[0]
            gh_api = f"https://api.github.com/repos/{repo}/pulls"
            body = (f"Prototype for ADO Feature 84645 (phase 0d).\n\nNOTICE generated by Component Governance for `{repo}` "
                    f"`{branch}`, snapshot type {type_id}.\n\nADO run: {run_url}\n\nDo not merge.")
            existing = call(f"{gh_api}?head={owner}:{head}&base={base}&state=open", bearer=gh)
            if existing:
                pr = call(existing[0]["url"], method="PATCH", body={"body": body}, bearer=gh)
                print(f"updated PR #{pr['number']} {pr['html_url']} (user {pr['user']['login']})")
            else:
                pr = call(gh_api, method="POST", bearer=gh, body={
                    "title": "chore(notice): refresh NOTICE from Component Governance (prototype)",
                    "head": head, "base": base, "body": body, "draft": True})
                print(f"opened PR #{pr['number']} {pr['html_url']} (user {pr['user']['login']})")
            PY
          displayName: Refresh NOTICE from CG and open PR
          condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/'), eq('${{ parameters.scanType }}', 'Register'))
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            NOTICE_PR_BASE: ${{ parameters.noticePrBase }}
            NOTICE_PR_BRANCH: ${{ parameters.noticePrBranch }}

      - publish: $(OUT)
        artifact: cg-scan-$(System.JobAttempt)
        condition: succeededOrFailed()